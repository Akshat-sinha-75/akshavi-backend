<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akshavi Live Emergency Tracker — Guardian View</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .guardian-header {
      background: #131a29;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    .guardian-title { display: flex; align-items: center; gap: 10px; }
    .shield-icon { background: #ec4899; color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .guardian-title h1 { font-size: 16px; font-weight: 800; }
    .guardian-title p { font-size: 11px; color: #94a3b8; }
    
    .status-badge { font-size: 11px; padding: 4px 8px; border-radius: 12px; background: rgba(16,185,129,0.15); color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .status-badge.sos { background: rgba(239,68,68,0.2); color: #ef4444; }
    
    #map { flex: 1; width: 100%; }
    
    .guardian-footer {
      background: #131a29;
      padding: 14px 16px;
      border-top: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .telemetry-row { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
    
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; }
    .btn-police { background: #ef4444; color: white; }
    .btn-nav { background: #06b6d4; color: white; }
  </style>
</head>
<body>
  <header class="guardian-header">
    <div class="guardian-title">
      <div class="shield-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <div>
        <h1 id="userNameHeading">Priya Sharma</h1>
        <p id="lastSeenText">Live Tracking Active</p>
      </div>
    </div>
    <div class="status-badge" id="liveStatusBadge">
      <span>●</span> Live Stream
    </div>
  </header>

  <div id="map"></div>

  <footer class="guardian-footer">
    <div class="telemetry-row">
      <span id="speedDisplay"><i class="fa-solid fa-gauge"></i> 0 km/h</span>
      <span id="batteryDisplay"><i class="fa-solid fa-battery-three-quarters"></i> 85% Battery</span>
      <span id="coordsDisplay">19.0760, 72.8777</span>
    </div>
    <div class="action-row">
      <a href="tel:112" class="btn btn-police"><i class="fa-solid fa-phone-volume"></i> Call Police 112</a>
      <a href="https://maps.google.com/?q=19.0760,72.8777" target="_blank" id="navLink" class="btn btn-nav"><i class="fa-solid fa-diamond-turn-right"></i> Navigate Map</a>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let currentLat = 19.0760, currentLng = 72.8777;
    const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([currentLat, currentLng], 16);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    
    const markerIcon = L.divIcon({
      className: 'custom-pin',
      html: '<div style="width:20px;height:20px;background:#ec4899;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(236,72,153,0.8);"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
    const marker = L.marker([currentLat, currentLng], { icon: markerIcon }).addTo(map);
    const trail = L.polyline([[currentLat, currentLng]], { color: '#ec4899', weight: 4, opacity: 0.8 }).addTo(map);

    // WebSocket Stream
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'LOCATION_UPDATE') {
          const lp = msg.payload;
          currentLat = lp.latitude;
          currentLng = lp.longitude;
          marker.setLatLng([currentLat, currentLng]);
          trail.addLatLng([currentLat, currentLng]);
          map.panTo([currentLat, currentLng]);

          document.getElementById('coordsDisplay').textContent = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
          document.getElementById('speedDisplay').innerHTML = `<i class="fa-solid fa-gauge"></i> ${(lp.speedMPS * 3.6).toFixed(1)} km/h`;
          document.getElementById('batteryDisplay').innerHTML = `<i class="fa-solid fa-battery-three-quarters"></i> ${lp.batteryLevel}% Battery`;
          document.getElementById('navLink').href = `https://maps.google.com/?q=${currentLat},${currentLng}`;
        } else if (msg.type === 'SOS_TRIGGERED') {
          document.getElementById('liveStatusBadge').className = 'status-badge sos';
          document.getElementById('liveStatusBadge').innerHTML = '<span>🚨</span> SOS ACTIVE';
        } else if (msg.type === 'SOS_RESOLVED') {
          document.getElementById('liveStatusBadge').className = 'status-badge';
          document.getElementById('liveStatusBadge').innerHTML = '<span>●</span> Live Stream';
        }
      } catch (err) {}
    };
  </script>
</body>
</html>
